sr:
  title: Акција прикупљања огрева за зиму
  slug: winter-firewood-action
  date: 2026-11-10
  topic: heating
  summary: Покрећемо акцију како би породице у потреби дочекале зиму у топлом дому.
  body: |
    Зима на Косову и Метохији је дуга и хладна, а многе породице немају средстава за огрев.

    Овим путем позивамо све људе добре воље да се укључе у акцију. Свака донација помаже да још једна породица буде на топлом.
